worker_processes auto;
pid nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" Host:"$host"';

    access_log logs/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client upload limits (match or exceed Nibleaf asset limits)
    client_max_body_size 50M;

    # Gzip compression for static assets and HTML
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Map for WebSocket connection upgrades (Vite HMR & real-time events)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Include modular Nibleaf site configuration
    include conf.d/*.conf;
}
