# ─────────────────────────────────────────────────────────────────────────────
# Nibleaf Ingress Proxy Configuration
# Routes:
#   1. App Dashboard:     nibleaf.local, app.nibleaf.local
#   2. Default Subdomain: *.nibleaf.local (e.g. docs.nibleaf.local)
#   3. Custom Domains:    Any custom domain (e.g. custom.local, *.local, or FQDN)
# ─────────────────────────────────────────────────────────────────────────────

upstream nibleaf_app {
    server 127.0.0.1:4310;
    keepalive 32;
}

upstream nibleaf_api {
    server 127.0.0.1:4311;
    keepalive 32;
}

# ─── 1. Main App & Dashboard (nibleaf.local, app.nibleaf.local) ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name nibleaf.local app.nibleaf.local;

    # Direct /api proxy to Hono API server
    location /api/ {
        proxy_pass http://nibleaf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for streaming responses (AI chats, SSE, chunked transfers)
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # All frontend routes and dev assets
    location / {
        proxy_pass http://nibleaf_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 300s;
    }
}

# ─── 2. Default Subdomains (*.nibleaf.local, e.g. docs.nibleaf.local) ────────
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>[a-zA-Z0-9-]+)\.nibleaf\.local$;

    # Same-origin /api proxy for published site assets and search queries
    location /api/ {
        proxy_pass http://nibleaf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
    }

    # Subdomain site rendering — Nibleaf extracts <subdomain> and resolves project slug
    location / {
        proxy_pass http://nibleaf_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 300s;
    }
}

# ─── 3. Custom Domains (Catch-All Ingress for verified custom domains) ────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Same-origin /api proxy for custom domain site assets
    location /api/ {
        proxy_pass http://nibleaf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_buffering off;
    }

    # Custom domain routing: Nibleaf looks up $host in prisma.domain (verified: true)
    # and rewrites to /sites/:projectId at its root. Unverified/unknown domains get 404.
    location / {
        proxy_pass http://nibleaf_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 300s;
    }
}
